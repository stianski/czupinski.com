<!DOCTYPE html>
<!-- Strona błędu 404. GitHub Pages pokazuje ten plik dla KAŻDEGO nieistniejącego adresu,
     także zagnieżdżonego (np. /cos/innego/), dlatego ścieżki do zasobów zaczynają się
     tutaj od ukośnika. Strona jest dwujęzyczna, bo nie wiemy, skąd przyszedł gość. -->
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Strony błędu nie chcemy w wynikach wyszukiwania. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f1f1a">
  <title>404 | czupinski.com</title>

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <main class="container error-page">
    <p class="eyebrow">404</p>
    <h1>Nie ma takiej strony</h1>
    <p>Adres jest błędny albo strona została przeniesiona. Nic się nie zepsuło, po prostu nic tu nie leży.</p>
    <p lang="en">This page does not exist. The address is wrong or the page has moved.</p>
    <p class="error-links">
      <a href="/">Strona główna</a>
      <a href="/en/" lang="en" hreflang="en">Home page (EN)</a>
    </p>
  </main>
</body>
</html>
